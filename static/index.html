<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recife Data Hub</title>
</head>
<body>

<header>
  <div class="logo">Smart City Recife</div>
  <h1>Recife Data Hub</h1>
  <p>Middleware de Interoperabilidade</p>
  <div class="server-status">
    <div class="dot" id="dot"></div>
    <span id="server-label">Verificando conexao...</span>
  </div>
</header>

<footer>Recife Data Hub v1.0.0</footer>

<script>
  window.addEventListener("load", () => {
    fetch("/status").then(r => r.json()).then(d => {
      document.getElementById("dot").style.background = "#22c55e";
      document.getElementById("server-label").textContent = "Servidor online: " + d.sistema;
    }).catch(() => {
      document.getElementById("server-label").textContent = "Servidor offline";
    });
  });
</script>

</body>
</html>
